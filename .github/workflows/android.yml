name: Eimer-Liste Android CI and optional signed release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EIMER_RELEASE_KEYSTORE_B64: ${{ secrets.EIMER_RELEASE_KEYSTORE_B64 }}
      EIMER_RELEASE_STORE_PASSWORD: ${{ secrets.EIMER_RELEASE_STORE_PASSWORD }}
      EIMER_RELEASE_KEY_ALIAS: ${{ secrets.EIMER_RELEASE_KEY_ALIAS }}
      EIMER_RELEASE_KEY_PASSWORD: ${{ secrets.EIMER_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile debug and unit tests (isolated Room schema generation)
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Compile release after debug (avoid concurrent KSP schema writes)
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare offline signing tool
        shell: bash
        run: |
          mkdir -p signing-tool
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" signing-tool/apksigner.jar
          test -s signing-tool/apksigner.jar
      - name: Upload unsigned release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eimerliste-v0.1-UNSIGNED-for-private-signing
          path: app/build/outputs/apk/release/*unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Privately sign update (only when repository secrets are provisioned)
        if: ${{ env.EIMER_RELEASE_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$EIMER_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/eimer-release.p12"
          test -s "$RUNNER_TEMP/eimer-release.p12"
          UNSIGNED=$(find app/build/outputs/apk/release -name '*unsigned.apk' -print -quit)
          test -n "$UNSIGNED"
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar"
          java -cp "$SIGNER" com.android.apksigner.ApkSignerTool sign \
            --ks "$RUNNER_TEMP/eimer-release.p12" \
            --ks-key-alias "$EIMER_RELEASE_KEY_ALIAS" \
            --ks-pass env:EIMER_RELEASE_STORE_PASSWORD \
            --key-pass env:EIMER_RELEASE_KEY_PASSWORD \
            --out "app/build/outputs/apk/release/Eimer-Liste-UPDATE.apk" "$UNSIGNED"
          java -cp "$SIGNER" com.android.apksigner.ApkSignerTool verify --verbose --print-certs \
            app/build/outputs/apk/release/Eimer-Liste-UPDATE.apk > "$RUNNER_TEMP/apk-verification.txt"
          grep -F "certificate SHA-256 digest: 40e6b73383a29f9ca792595b369329e2ab8f9165f49eec69b4eb57a8ffe26fe1" "$RUNNER_TEMP/apk-verification.txt"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apk-verification.txt"
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/apk-verification.txt"
          rm -f "$RUNNER_TEMP/eimer-release.p12"
      - name: Upload verified signed update
        if: ${{ env.EIMER_RELEASE_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Eimer-Liste-update-SIGNED
          path: app/build/outputs/apk/release/Eimer-Liste-UPDATE.apk
          if-no-files-found: error
          retention-days: 60
      - name: Upload offline signing tool
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apksigner-for-private-release
          path: signing-tool/apksigner.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload temporary debug build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eimerliste-debug-NOT-UPDATE-SAFE
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
