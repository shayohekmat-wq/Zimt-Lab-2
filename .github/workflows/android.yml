name: Eimer-Liste CI and manually gated update release

on:
  push:
    branches: [development/integrated-milestone]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      previous_version_code:
        description: Highest versionCode already distributed (required when signing)
        type: string
        required: false

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      candidate_sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify design quality contract is present
        shell: bash
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s docs/DESIGN_PRINCIPLES.md
          test -s docs/DESIGN_QA.md
          test -s docs/PERFORMANCE_BUDGET.md
          test -s docs/COMPATIBILITY_MATRIX.md
          test -s docs/ADAPTIVE_MOTION.md
          grep -q "UNVERIFIED" docs/COMPATIBILITY_MATRIX.md
          test -s docs/DEVELOPMENT_DOCTRINE.md
          test -s docs/ACTIVE_SCOPE.md
          grep -q '7.0' docs/DEVELOPMENT_DOCTRINE.md
          grep -q 'exactly three user-original' docs/ACTIVE_SCOPE.md
          test -s docs/MOTION_FIRST_PLAN.md
          test -s docs/MOTO_G6_REFERENCE.md
          grep -q "Moto-G6-first" docs/MOTION_FIRST_PLAN.md
          grep -q "superseded" docs/ADAPTIVE_MOTION.md
          test -s docs/ENGINEERING_LEGIBILITY_PROTOCOL.md
          grep -q 'ENGINEERING_LEGIBILITY_PROTOCOL.md' AGENTS.md
          grep -q 'MOT-01' docs/DESIGN_QA.md
          echo "Design QA contract present; visual/device acceptance requires separate evidence"
      - name: Compile debug and unit tests (isolated Room schema generation)
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Test private signing inputs with a disposable identity
        env:
          EIMER_TEST_APK: app/build/outputs/apk/debug/app-debug.apk
        run: PATH="$ANDROID_HOME/build-tools/37.0.0:$PATH" python3 -B tools/test_eimer_signer.py -v
      - name: Upload JUnit reports even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eimerliste-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/**/*.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Compile release after debug (avoid concurrent KSP schema writes)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/development/integrated-milestone') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify release package and build version
        id: manifest
        if: (github.event_name == 'push' && github.ref == 'refs/heads/development/integrated-milestone') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*unsigned.apk' -print -quit)
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          test -x "$AAPT"
          BADGING=$("$AAPT" dump badging "$APK")
          PACKAGE=$(printf '%s\\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
          VERSION=$(printf '%s\\n' "$BADGING" | sed -n "s/^package:.*versionCode='\\([0-9]*\\)'.*/\\1/p" | head -n 1)
          test "$PACKAGE" = "de.zimt.eimerliste"
          test -n "$VERSION"
          test "$VERSION" -gt 45
          sha256sum "$APK" | cut -d " " -f 1 | sed "s/^/sha256=/" >> "$GITHUB_OUTPUT"
          echo "Release manifest verified: $PACKAGE versionCode=$VERSION"
      - name: Prepare offline signing tool
        if: (github.event_name == 'push' && github.ref == 'refs/heads/development/integrated-milestone') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          mkdir -p signing-tool
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" signing-tool/apksigner.jar
          test -s signing-tool/apksigner.jar
      - name: Upload unsigned release APK
        if: (github.event_name == 'push' && github.ref == 'refs/heads/development/integrated-milestone') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: eimerliste-UNSIGNED-release-for-private-signing
          path: app/build/outputs/apk/release/*unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload offline signing tool
        if: (github.event_name == 'push' && github.ref == 'refs/heads/development/integrated-milestone') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: apksigner-for-private-release
          path: signing-tool/apksigner.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload temporary debug build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eimerliste-debug-NOT-UPDATE-SAFE
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download this build's unsigned candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: eimerliste-UNSIGNED-release-for-private-signing
          path: candidate
      - name: Verify candidate and sign with the configured update key
        id: sign
        shell: bash
        env:
          CANDIDATE_SHA256: ${{ needs.build.outputs.candidate_sha256 }}
          PREVIOUS_VERSION_CODE: ${{ inputs.previous_version_code }}
          EIMER_RELEASE_KEYSTORE_B64: ${{ secrets.EIMER_RELEASE_KEYSTORE_B64 }}
          EIMER_RELEASE_STORE_PASSWORD: ${{ secrets.EIMER_RELEASE_STORE_PASSWORD }}
          EIMER_RELEASE_KEY_ALIAS: ${{ secrets.EIMER_RELEASE_KEY_ALIAS }}
          EIMER_RELEASE_KEY_PASSWORD: ${{ secrets.EIMER_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$EIMER_RELEASE_KEYSTORE_B64" ]]; then
            echo "Private offline signing remains available for this candidate."
            exit 0
          fi
          : "${EIMER_RELEASE_STORE_PASSWORD:?}" "${EIMER_RELEASE_KEY_ALIAS:?}" "${EIMER_RELEASE_KEY_PASSWORD:?}"
          [[ "$PREVIOUS_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]]
          apk=candidate/app-release-unsigned.apk
          [[ "$CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$apk" | sha256sum --check --status
          # Use SDK tools from the clean runner, independent of the application build.
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          badging=$("$(dirname "$signer")/aapt" dump badging "$apk")
          version=$(sed -n "s/^package: name='de\.zimt\.eimerliste' versionCode='\([0-9]*\)'.*/\1/p" <<< "$badging")
          [[ "$version" =~ ^[1-9][0-9]{0,9}$ && "$version" -gt "$PREVIOUS_VERSION_CODE" ]]
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/eimer-XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$EIMER_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          "$signer" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias "$EIMER_RELEASE_KEY_ALIAS" \
            --ks-pass env:EIMER_RELEASE_STORE_PASSWORD --key-pass env:EIMER_RELEASE_KEY_PASSWORD \
            --v2-signing-enabled true --v3-signing-enabled true --out Eimer-Liste-UPDATE.apk "$apk"
          report=$("$signer" verify --verbose --print-certs Eimer-Liste-UPDATE.apk)
          certificates=$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' <<< "$report")
          [[ "$certificates" == "40e6b73383a29f9ca792595b369329e2ab8f9165f49eec69b4eb57a8ffe26fe1" ]]
          grep -Fxq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$report"
          grep -Fxq 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$report"
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - name: Upload verified signed update
        if: steps.sign.outputs.verified == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Eimer-Liste-update-SIGNED
          path: Eimer-Liste-UPDATE.apk
          if-no-files-found: error
          retention-days: 60
