name: Eimer-Liste Android Room regression
on:
  push:
    branches: [development/integrated-milestone]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eimer-room-${{ github.ref }}
  cancel-in-progress: true
jobs:
  room-on-api-28:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Allow KVM access on hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile previous exact build in isolated checkout
        run: |
          git fetch --depth=1 origin 357a714ac2b704e305c2b59a695a422658d67e75
          git worktree add --detach "$RUNNER_TEMP/eimer-baseline" FETCH_HEAD
          gradle --no-daemon -p "$RUNNER_TEMP/eimer-baseline" :app:assembleDebug
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run Room instrumentation on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          disable-animations: true
          script: bash tools/test_android_upgrade.sh
      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-api28-report
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/upgrade-evidence/
          if-no-files-found: ignore
