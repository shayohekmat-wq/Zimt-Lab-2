name: Eimer-Liste CI and manually gated update release

on:
  push:
    branches: [development/integrated-milestone]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EIMER_RELEASE_KEYSTORE_B64: ${{ secrets.EIMER_RELEASE_KEYSTORE_B64 }}
      EIMER_RELEASE_STORE_PASSWORD: ${{ secrets.EIMER_RELEASE_STORE_PASSWORD }}
      EIMER_RELEASE_KEY_ALIAS: ${{ secrets.EIMER_RELEASE_KEY_ALIAS }}
      EIMER_RELEASE_KEY_PASSWORD: ${{ secrets.EIMER_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify design quality contract is present
        shell: bash
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s docs/DESIGN_PRINCIPLES.md
          test -s docs/DESIGN_QA.md
          test -s docs/PERFORMANCE_BUDGET.md
          test -s docs/COMPATIBILITY_MATRIX.md
          test -s docs/ADAPTIVE_MOTION.md
          grep -q "UNVERIFIED" docs/COMPATIBILITY_MATRIX.md
          test -s docs/DEVELOPMENT_DOCTRINE.md
          test -s docs/ACTIVE_SCOPE.md
          grep -q 'No blanket feature freeze' docs/DEVELOPMENT_DOCTRINE.md
          grep -q 'exactly three user-original' docs/ACTIVE_SCOPE.md
          test -s docs/MOTION_FIRST_PLAN.md
          test -s docs/MOTO_G6_REFERENCE.md
          grep -q "Moto-G6-first" docs/MOTION_FIRST_PLAN.md
          grep -q "superseded" docs/ADAPTIVE_MOTION.md
          grep -q 'Animation-maximalist' AGENTS.md
          grep -q 'MOT-01' docs/DESIGN_QA.md
          echo "Design QA contract present; visual/device acceptance requires separate evidence"
      - name: Compile debug and unit tests (isolated Room schema generation)
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Upload JUnit reports even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eimerliste-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/**/*.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Compile release after debug (avoid concurrent KSP schema writes)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify release package and monotonically increasing version
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*unsigned.apk' -print -quit)
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          test -x "$AAPT"
          BADGING=$("$AAPT" dump badging "$APK")
          PACKAGE=$(printf '%s\\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
          VERSION=$(printf '%s\\n' "$BADGING" | sed -n "s/^package:.*versionCode='\\([0-9]*\\)'.*/\\1/p" | head -n 1)
          test "$PACKAGE" = "de.zimt.eimerliste"
          test -n "$VERSION"
          test "$VERSION" -gt 38
          echo "Release manifest verified: $PACKAGE versionCode=$VERSION"
      - name: Prepare offline signing tool
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p signing-tool
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" signing-tool/apksigner.jar
          test -s signing-tool/apksigner.jar
      - name: Upload unsigned release APK
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: eimerliste-UNSIGNED-release-for-private-signing
          path: app/build/outputs/apk/release/*unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Privately sign update (only when repository secrets are provisioned)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && env.EIMER_RELEASE_KEYSTORE_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$EIMER_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/eimer-release.p12"
          test -s "$RUNNER_TEMP/eimer-release.p12"
          UNSIGNED=$(find app/build/outputs/apk/release -name '*unsigned.apk' -print -quit)
          test -n "$UNSIGNED"
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar"
          java -cp "$SIGNER" com.android.apksigner.ApkSignerTool sign \
            --ks "$RUNNER_TEMP/eimer-release.p12" \
            --ks-key-alias "$EIMER_RELEASE_KEY_ALIAS" \
            --ks-pass env:EIMER_RELEASE_STORE_PASSWORD \
            --key-pass env:EIMER_RELEASE_KEY_PASSWORD \
            --out "app/build/outputs/apk/release/Eimer-Liste-UPDATE.apk" "$UNSIGNED"
          java -cp "$SIGNER" com.android.apksigner.ApkSignerTool verify --verbose --print-certs \
            app/build/outputs/apk/release/Eimer-Liste-UPDATE.apk > "$RUNNER_TEMP/apk-verification.txt"
          grep -F "certificate SHA-256 digest: 40e6b73383a29f9ca792595b369329e2ab8f9165f49eec69b4eb57a8ffe26fe1" "$RUNNER_TEMP/apk-verification.txt"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apk-verification.txt"
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/apk-verification.txt"
          rm -f "$RUNNER_TEMP/eimer-release.p12"
      - name: Upload verified signed update
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && env.EIMER_RELEASE_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: Eimer-Liste-update-SIGNED
          path: app/build/outputs/apk/release/Eimer-Liste-UPDATE.apk
          if-no-files-found: error
          retention-days: 60
      - name: Upload offline signing tool
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: apksigner-for-private-release
          path: signing-tool/apksigner.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload temporary debug build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eimerliste-debug-NOT-UPDATE-SAFE
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
