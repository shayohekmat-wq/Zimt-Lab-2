name: Android CI (development only)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android API 37 (runner SDK)
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0"
      - name: Gradle 9.6 (AGP 9.5)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile and test
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Upload ephemeral debug build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eimerliste-debug-NOT-UPDATE-SAFE
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
